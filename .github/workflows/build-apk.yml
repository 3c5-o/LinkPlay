name: Build LinkPlay APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Locate Android SDK tools
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          find "${ANDROID_HOME}" -type f -name sdkmanager 2>/dev/null | head -10
          echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME}/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME}" -type f -name sdkmanager 2>/dev/null | head -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found in runner Android SDK" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LinkPlay-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
